[program:cj-import-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:work --queue=cj-import --sleep=1 --tries=3 --max-time=900
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/cj-import-worker.log
stopwaitsecs=3600

# Environment variables for production
environment=LARAVEL_ENV=production
